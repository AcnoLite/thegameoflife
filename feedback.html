<body id="top">
  <a class="skip-link" href="#main">Aller au contenu</a>

  <!-- Navigation principale -->
  <nav aria-label="Navigation principale">
    <ul>
      <li><a href="index.html">Histoire</a></li>
      <li><a href="rules.html">Les règles</a></li>
      <li><a href="game.html">Le jeu</a></li>
      <li><a href="feedback.html" aria-current="page">Avis</a></li>
      <li><button id="theme-toggle" type="button" aria-pressed="false">Changer de style</button></li>
    </ul>
  </nav>

  <!-- Contenu principal : formulaire d'avis -->
  <main id="main">
    <header>
      <h1>Avis</h1>
      <p class="subtitle">Votre retour nous aide à améliorer le site</p>
    </header>

    <!-- Formulaire d'avis : envoi par e-mail (mailto:) via js/feedback.js -->
    <section>
      <h2>Donner votre avis</h2>
      <form id="feedback-form">
        <fieldset>
          <legend>Votre avis</legend>

          <p>
            <label for="feedback-name">Nom</label>
            <input id="feedback-name" name="name" type="text" required minlength="2" maxlength="40" pattern="[A-Za-zÀ-ÿ' ’-]{2,40}" title="2 à 40 lettres, espaces, tirets ou apostrophes" placeholder="Votre nom" autocomplete="name">
          </p>

          <p>
            <label for="feedback-email">E-mail (facultatif)</label>
            <input type="email" id="feedback-email" name="email" autocomplete="email" placeholder="vous@exemple.fr">
          </p>

          <p>
            <label for="feedback-rating">Note</label>
            <select id="feedback-rating" name="rating" required>
              <option value="">Choisissez une note</option>
              <option value="1">1 — Perfectible</option>
              <option value="2">2 — Insuffisant</option>
              <option value="3">3 — Correct</option>
              <option value="4">4 — Bon</option>
              <option value="5">5 — Excellent</option>
            </select>
          </p>

          <p>
            <label for="feedback-message">Message</label>
            <textarea id="feedback-message" name="message" rows="6" required maxlength="1000" placeholder="Votre message"></textarea>
          </p>

          <p><button type="submit">Envoyer mon avis</button></p>
          <p id="form-status" role="status"></p>
        </fieldset>
      </form>
    </section>

    <!-- Pied de page : coordonnées de l'IUT -->
    <p>Département informatique — IUT d'Aix-Marseille, 413 avenue Gaston Berger, 13625 Aix-en-Provence Cedex 1.</p>

    <a id="back-to-top" href="#top">↑ Haut de page</a>
  </main>
</body>
</html>
